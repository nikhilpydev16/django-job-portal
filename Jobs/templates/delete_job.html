{% extends 'base.html' %}

{% block content %}

<div class="empty-box">
    <h2>Delete Job?</h2>
    <p>Are you sure you want to delete <strong>{{ job.title }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>
    <a href="{% url 'my_posted_jobs' %}">Cancel</a>
</div>

{% endblock %}
