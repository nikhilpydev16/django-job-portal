{% extends 'base.html' %}

{% block content %}

<div class="post-job-form">
    <h2>Edit Job</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title" value="{{ job.title }}" required>
        <input type="text" name="company" value="{{ job.company }}" required>
        <input type="text" name="location" value="{{ job.location }}" required>
        <input type="text" name="salary" value="{{ job.salary }}" required>
        <input type="text" name="skills_required" value="{{ job.skills_required }}" required>
        <textarea name="description" required>{{ job.description }}</textarea>

        <select name="status">
        <option value="Open" {% if job.status == "Open" %}selected{% endif %}>Open</option>
        <option value="Closed" {% if job.status == "Closed" %}selected{% endif %}>Closed</option>
        </select>

        <button type="submit">Update Job</button>
    </form>
</div>

{% endblock %}
